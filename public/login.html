<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MeetSecure</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="form-box">
    <h2>Connexion</h2>
    <p id="form-info" class="success-msg"></p>
    <p id="form-error" class="error-msg"></p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>

      <button type="submit" class="btn">Se connecter</button>
    </form>
    <p class="switch-link">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
  </div>
</main>

<footer>© 2026 MeetSecure — Projet de démonstration WebRTC</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
