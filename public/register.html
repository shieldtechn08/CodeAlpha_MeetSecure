<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — MeetSecure</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="form-box">
    <h2>Créer un compte</h2>
    <p id="form-error" class="error-msg"></p>
    <form id="register-form">
      <label for="name">Nom complet</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Mot de passe (6 caractères min.)</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit" class="btn">S'inscrire</button>
    </form>
    <p class="switch-link">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</main>

<footer>© 2026 MeetSecure — Projet de démonstration WebRTC</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
